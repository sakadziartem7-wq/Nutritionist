<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home</title>
    <link rel="stylesheet" href="css/home.css" />
  </head>

  <body>
    <section class="banner">
      <svg class="banner__decor banner__decor--left"><use href="assets/icons.svg#decor-left"></use></svg>
      <svg class="banner__decor banner__decor--right"><use href="assets/icons.svg#decor-right"></use></svg>
      <div class="container">
        <div class="banner__content">
          <svg class="banner__icon"><use href="assets/icons.svg#leaf"></use></svg>
          <p class="banner__text">Join Our Personalized Nutrition Demo For Free</p>
          <svg class="banner__arrow"><use href="assets/icons.svg#arrow"></use></svg>
        </div>
      </div>
      <div class="banner__hr"></div>
    </section>
    <header class="header">
      <div class="container">
        <div class="header__row">
          <a href="#" title="logo" class="header__logo">
            <svg class="header__logo-icon">
              <use href="assets/icons.svg#logo"></use>
            </svg>
          </a>
          <div class="header__wrap">
            <nav class="header__main">
              <a href="#" title="Home" class="header__link header__link--active">Home</a>
              <a href="#" title="About" class="header__link">About</a>
              <a href="#" title="Team" class="header__link">Team</a>
              <a href="#" title="Process" class="header__link">Process</a>
              <a href="#" title="Pricing" class="header__link">Pricing</a>
              <a href="#" title="Blog" class="header__link">Blog</a>
            </nav>
            <button class="header__button button">Contact Us</button>
          </div>
          <button class="header__burger" id="burger">
            <svg class="burger__icon">
              <use href="assets/icons.svg#burger"></use>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <script src="js/main.js" defer></script>
  </body>
</html>
